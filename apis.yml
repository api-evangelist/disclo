aid: disclo
name: Disclo
description: 'Disclo is a workplace-accommodations software platform that powers end-to-end
  management of ADA, FMLA, and state-leave requests, medical-certification verification,
  and the interactive accommodation process for employers. The HIPAA- and SOC 2-compliant
  portal automates accommodation workflows and compliance documentation, adds AI-assisted
  medical-certification review (Disclo Verify) and candidate accommodations for recruiting
  (Disclo Hire), and integrates with 50+ HRIS and ATS systems. Disclo is a private B2B
  SaaS company backed by Bain Capital Ventures and General Catalyst; it operates a secure
  customer portal (secure.disclo.com) and does not currently publish a public developer
  API, SDKs, or OpenAPI. Access is enterprise, demo/sales-led rather than self-serve.'
